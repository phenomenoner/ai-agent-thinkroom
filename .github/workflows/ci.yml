name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  native-python:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install locked uv frontend
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: false
      - name: Verify and test native package
        run: |
          uv lock --check
          uv sync --locked --all-extras --dev
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy src scripts
          uv run pytest -q

# Docker is intentionally absent: it is operator-owned reference material,
# not part of the native-process release contract.
