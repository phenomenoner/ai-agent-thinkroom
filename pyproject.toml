[project]
name = "thinkroom"
version = "0.2.3"
description = "Evidence-linked multi-perspective AI research for consequential questions"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "CK" },
  { name = "Martin (Hermes Agent)" },
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "typer>=0.12",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "mcp<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
thinkroom = "thinkroom.cli:app"

[project.urls]
Repository = "https://github.com/phenomenoner/ai-agent-thinkroom"
Issues = "https://github.com/phenomenoner/ai-agent-thinkroom/issues"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thinkroom"]


[tool.ruff]
line-length = 100
exclude = ["thinkroom_ai_think_tank_product_concept.md"]
extend-exclude = [".venv"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
